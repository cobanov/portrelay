name: Build and check
on:
  push:
    branches: [main, feature/windows-support]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo +1.97.0 fmt --all --check
      - run: cargo +1.97.0 test --locked --workspace
      - run: cargo +1.97.0 clippy --locked --workspace --all-targets -- -D warnings
      - run: node --check app-ui/app.js && npm run check && npm run build
  linux-package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    container: rust:1.97-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --release
      - run: ./packaging/package-linux.sh target/release/portrelay ${{ matrix.arch }}
      - run: ./packaging/package-deb.sh target/release/portrelay debian ${{ matrix.deb_arch }}
      - run: ./packaging/package-deb.sh target/release/portrelay ubuntu ${{ matrix.deb_arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: portrelay-linux-${{ matrix.arch }}-alpha
          path: |
            target/packages/*.tar.gz
            target/packages/*.deb
            target/packages/*.sha256
          retention-days: 30
  linux-armv7-package:
    runs-on: ubuntu-24.04-arm
    container: rust:1.97-bookworm
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: qemu-arm -L /usr/arm-linux-gnueabihf
      PORTRELAY_PACKAGE_RUNNER: qemu-arm -L /usr/arm-linux-gnueabihf
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - run: rustup target add armv7-unknown-linux-gnueabihf
      - run: cargo test --locked --workspace --target armv7-unknown-linux-gnueabihf
      - run: cargo build --locked --release --target armv7-unknown-linux-gnueabihf
      - run: ./packaging/package-linux.sh target/armv7-unknown-linux-gnueabihf/release/portrelay armv7
      - run: ./packaging/package-deb.sh target/armv7-unknown-linux-gnueabihf/release/portrelay debian armhf
      - uses: actions/upload-artifact@v4
        with:
          name: portrelay-linux-armv7-alpha
          path: |
            target/packages/*.tar.gz
            target/packages/*.deb
            target/packages/*.sha256
          retention-days: 30
  linux-headless-install:
    needs: linux-package
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portrelay-linux-${{ matrix.arch }}-alpha
          path: target/packages
      - run: sudo env GITHUB_ACTIONS=true ./tests/headless-install.sh target/packages/*-ubuntu-${{ matrix.deb_arch }}.deb
  windows-backend-check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.317
      - run: dotnet run --project windows/tests/PortRelay.WireTests.csproj
  windows-package:
    needs: windows-backend-check
    runs-on: windows-2025
    env:
      CARGO_TARGET_DIR: target/rust-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.317
      - run: rustup toolchain install 1.97.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: windows-rust-v2
          workspaces: . -> target/rust-windows
      - run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrelay-windows-agent-test
          path: target/windows-package/app/portrelay*.exe
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrelay-windows-test-build
          path: target/windows-package/app/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: portrelay-windows-x64-alpha
          path: target/packages/*windows*
          retention-days: 30
