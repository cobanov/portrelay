name: Build and check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.97.0 fmt --all --check
      - run: cargo +1.97.0 test --locked --workspace
      - run: cargo +1.97.0 clippy --locked --workspace --all-targets -- -D warnings
      - run: node --check app-ui/app.js && npm run check && npm run build
  linux-package:
    runs-on: ubuntu-24.04
    container: rust:1.97-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --release
      - run: ./packaging/package-linux.sh target/release/portrelay x86_64
      - run: ./packaging/package-deb.sh target/release/portrelay debian
      - run: ./packaging/package-deb.sh target/release/portrelay ubuntu
      - uses: actions/upload-artifact@v4
        with:
          name: portrelay-linux-x86_64-alpha
          path: |
            target/packages/*.tar.gz
            target/packages/*.deb
            target/packages/*.sha256
          retention-days: 30
