name: Build and check
on:
  push:
    branches: [main, feature/windows-support]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo +1.97.0 fmt --all --check
      - run: cargo +1.97.0 test --locked --workspace
      - run: cargo +1.97.0 clippy --locked --workspace --all-targets -- -D warnings
      - run: node --check app-ui/app.js && npm run check && npm run build
  linux-package:
    runs-on: ubuntu-24.04
    container: rust:1.97-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --release
      - run: ./packaging/package-linux.sh target/release/portrelay x86_64
      - run: ./packaging/package-deb.sh target/release/portrelay debian
      - run: ./packaging/package-deb.sh target/release/portrelay ubuntu
      - uses: actions/upload-artifact@v4
        with:
          name: portrelay-linux-x86_64-alpha
          path: |
            target/packages/*.tar.gz
            target/packages/*.deb
            target/packages/*.sha256
          retention-days: 30
  windows-package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.317
      - run: rustup toolchain install 1.97.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrelay-windows-test-build
          path: target/windows-package/app/
          retention-days: 7
      - run: dotnet run --project windows/tests/PortRelay.WireTests.csproj
      - uses: actions/upload-artifact@v4
        with:
          name: portrelay-windows-x64-alpha
          path: target/packages/*windows*
          retention-days: 30
